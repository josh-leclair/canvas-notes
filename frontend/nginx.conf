server {
    listen 80;

    # Docker may replace the backend container during a rebuild, giving the
    # service a new IP while this nginx container stays alive. A hostname in a
    # literal proxy_pass is resolved only when nginx starts, which leaves it
    # dialing the dead container until the frontend is restarted. Using
    # Docker's embedded resolver with a variable keeps the service name live.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # nginx defaults to 1m, which is smaller than anything this app actually
    # accepts: a phone photo, a voice memo, or any attachment would have been
    # rejected here with a bare 413 before the backend ever saw it — and the
    # backend is the one that knows the real per-kind limits and can say which
    # was exceeded. Set to the largest of them (MAX_AUDIO_BYTES in
    # `app/media.py`) so the proxy never refuses something the app would take.
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The built JS and CSS filenames are content-hashed, but index.html is the
    # pointer to those hashes. Never let a browser or an upstream proxy keep an
    # old pointer after the frontend container has been rebuilt.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
